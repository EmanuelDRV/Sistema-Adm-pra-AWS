<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AdmNachtShop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f1115;
            color: #DBDEE1;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #14171c;
            border: 1px solid #35373C;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .form-control {
            background-color: #0f1115;
            border: 1px solid #35373C;
            color: #DBDEE1;
        }
        .form-control:focus {
            background-color: #0f1115;
            border-color: #5865F2;
            color: #DBDEE1;
            box-shadow: 0 0 0 0.25rem rgba(88, 101, 242, 0.25);
        }
        .btn-primary {
            background-color: #5865F2;
            border-color: #5865F2;
        }
        .btn-primary:hover {
            background-color: #4752C4;
            border-color: #4752C4;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="bi bi-tv-fill text-primary" style="font-size: 3rem;"></i>
        <h4 class="mt-2 fw-bold text-white">AdmNachtShop</h4>
        <p class="text-muted small">Panel de Administración</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show text-center" role="alert">
            {{ message }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label text-muted small fw-bold">Usuario</label>
            <div class="input-group">
                <span class="input-group-text border-secondary text-muted" style="background-color: #0f1115;">
                    <i class="bi bi-person-fill"></i>
                </span>
                <input type="text" class="form-control" name="username" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small fw-bold">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text border-secondary text-muted" style="background-color: #0f1115;">
                    <i class="bi bi-key-fill"></i>
                </span>
                <input type="password" class="form-control" name="password" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3">Ingresar</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
